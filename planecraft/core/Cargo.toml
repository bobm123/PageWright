[package]
name = "planecraft_core"
version = "0.1.0"
edition = "2021"
description = "Where a traced part sits in an airframe: frames, stations and placement."
license = "MIT"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[lib]
name = "planecraft_core"
path = "src/lib.rs"

[[bin]]
name = "planecraft-core"
path = "src/main.rs"
